<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        label {
            display: block;
        }

        input {
            padding: 6px;
            margin: 5px 0px;
            width: 100%;
            border: 0;
        }
        button, input {
            border-radius: 5px;
        }
        h3 {
            margin-bottom: 5px;
            background-color: skyblue;
            padding: 3px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>
        <header style="background-color: dimgrey; padding: 5px; text-align: center; color: white;">
            Checkout Form
    </h1>
    </header>
    <div style="padding: 20px; display: flex; gap: 10px;">
        <div style="background-color: steelblue; padding: 10px; border: 1px solid black; border-radius: 10px; width: 70vw;">
            <form onsubmit="handleSubmit(event)" style="display: flex; gap: 10px; flex-direction: column;">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <section style="width: 100%">
                    <h3>
                        Personal Details
                    </h3>
                    <div>
                        <label>
                            Full Name
                        </label>
                        <input id="name" type="text">
                    </div>
                    <div>
                        <label>
                            Email
                        </label>
                        <input id="email" type="email">
                    </div>
                    <div>
                        <label>
                            Departure Location
                        </label>
                        <input id="from" type="text">
                    </div>
                    <div>
                        <label>
                            Destination
                        </label>
                        <input id="to" type="text">
                    </div>
                </section>
                <section style="width: 100%">
                    <h3>
                        PAyment Details
                    </h3>
                    <div>
                        <label>
                            Card Number
                        </label>
                        <input id="card_num" type="number">
                    </div>
                    <div>
                        <label>
                            Card Holder's Name
                        </label>
                        <input id="card_name" type="text">
                    </div>
                    <div>
                        <label>
                            CVV
                        </label>
                        <input id="Cvv" type="password">
                    </div>
                </section>
                </div>
                <button type="submit" style="border: 0; padding: 5px; background-color: greenyellow; text-align: center;">Checkout</button>
            </form>
        </div>
        <div style="padding: 20px; background-color: darkgreen; border-radius: 6px; width: 27vw; color: white; font-size: 20px;">
            <div style="display: flex; justify-content: space-between;">
                <h4> Cost Per Member </h4>
                <h4 style="margin-right: 12px;"> Price </h4>
            </div>
            <hr>
            <div style="display: flex; justify-content: space-between; padding: 5px;">
                <p>Female</p>
                <p>$5,000</p>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 5px;">
                <p>Male</p>
                <p>$5,000</p>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 5px;">
                <p>Child</p>
                <p>$3,000</p>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 5px;">
                <p>Elderly</p>
                <p>$4,000</p>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 5px;">
                <p>Family</p>
                <p>$15,000</p>
            </div>
        </div>
    </div>
</body>

</html>
